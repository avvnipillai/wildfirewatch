# render.yaml — Deploy to Render.com with one click
# Push this to GitHub, then connect the repo on render.com

services:
  - type: web
    name: wildfirewatch
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a secure key automatically
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "wildfirewatch.onrender.com"
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 2